{% extends "base.html" %}

{% block content %}
<div class="home-content">
    <section class="home-card">
        <h2 class="section-heading"><i class="fa-solid fa-location-dot"></i>避難所マップ</h2>
        <div class="map-frame">
            <div id="shelterMap"></div>
        </div>
    </section>

    <section class="home-card">
        <h2 class="section-heading weather-heading">
            <span class="heading-label"><i class="fa-solid fa-cloud-sun"></i>青森市 気象警報・注意報</span>
            <span class="refresh-label"><i class="fa-solid fa-arrows-rotate"></i>10分おき自動更新</span>
        </h2>
        <div id="weatherContent" class="weather-panel">
            <p>読み込み中...</p>
        </div>
    </section>
</div>

<!-- Leaflet の読み込み -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // 地図の初期化（青森市周辺を中心に設定）
    const map = L.map('shelterMap').setView([40.8244, 140.7400], 12);

    // OpenStreetMapタイルを追加
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // 気象警報・注意報の自動更新機能
    function updateWeatherWarnings() {
        fetch('/api/weather_warnings')
            .then(response => response.json())
            .then(data => {
                console.log('気象情報を更新しました:', data);
                updateWeatherContent(data);
            })
            .catch(error => {
                console.error('気象情報の更新に失敗しました:', error);
            });
    }

    function updateWeatherContent(data) {
        const weatherContent = document.getElementById('weatherContent');

        if (data.error) {
            weatherContent.innerHTML = '<p>気象情報の取得に失敗しました</p>';
            return;
        }

        let warningsHtml = '';
        if (data.warnings && data.warnings.length > 0) {
            warningsHtml = '<ul class="weather-warnings">';
            data.warnings.forEach(warning => {
                warningsHtml += `<li>${warning.name}（${warning.status}）</li>`;
            });
            warningsHtml += '</ul>';
        } else {
            warningsHtml = '<p class="weather-clear"><i class="fa-solid fa-circle-check"></i>現在、警報・注意報は発表されていません</p>';
        }

        const forecast = data.forecast || {};
        const latestPeriod = (forecast.periods || [])[0];
        const codeGroup = latestPeriod && latestPeriod.code ? latestPeriod.code.charAt(0) : '';
        const weatherIcon = codeGroup === '1'
            ? 'fa-sun'
            : codeGroup === '2'
                ? 'fa-cloud-sun'
                : codeGroup === '3'
                    ? 'fa-cloud-showers-heavy'
                    : 'fa-snowflake';
        const latestWeatherHtml = latestPeriod
            ? `<div class="latest-weather"><i class="fa-solid ${weatherIcon}"></i><div><span class="latest-time">${latestPeriod.time}点の予報</span><strong>${latestPeriod.weather}</strong></div></div>`
            : '<p>予報を取得できませんでした</p>';
        const temperatureHtml = forecast.max_temperature !== null && forecast.min_temperature !== null
            ? `<div class="temperature-summary"><span><i class="fa-solid fa-temperature-arrow-up"></i>最高 <strong>${forecast.max_temperature}℃</strong></span><span><i class="fa-solid fa-temperature-arrow-down"></i>最低 <strong>${forecast.min_temperature}℃</strong></span></div>`
            : '';

        weatherContent.innerHTML = `
            <p class="weather-location"><i class="fa-solid fa-location-dot"></i>${data.area_name || '青森市'}</p>
            <div class="today-forecast"><p class="forecast-title">今日の最新予報</p>${latestWeatherHtml}${temperatureHtml}</div>
            ${warningsHtml}
            <p class="weather-meta"><i class="fa-regular fa-clock"></i>データ取得: ${data.last_fetch_time || '更新中...'}</p>
            <p class="weather-meta"><i class="fa-solid fa-satellite-dish"></i>気象庁発表: ${data.report_time || '不明'}</p>
        `;
    }

    // 初回表示＋10分（600,000ミリ秒）おきに自動更新
    updateWeatherWarnings();
    setInterval(updateWeatherWarnings, 600000);
});
</script>
{% endblock %}
