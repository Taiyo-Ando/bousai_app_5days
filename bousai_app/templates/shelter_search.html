{% extends "base.html" %}

{% block content %}
<h2>避難所検索</h2>
<p>現在地の住所から近い順に避難所を検索できます。</p>

<form method="get" action="{{ url_for('search_results') }}">
	<p>
		<label for="address">現在地の住所</label><br>
		<input type="text" id="address" name="address" required placeholder="例：青森市中央1丁目1-1">
	</p>
	<fieldset>
		<legend>必要な設備・対応</legend>
		<label><input type="checkbox" name="features" value="wheelchair"> 車いす対応</label>
		<label><input type="checkbox" name="features" value="multipurpose_toilet"> 多目的トイレ</label>
		<label><input type="checkbox" name="features" value="sensory_support"> 視覚・聴覚障碍者向け施設</label>
		<label><input type="checkbox" name="features" value="pets_allowed"> ペット可</label>
	</fieldset>
	<p><button type="submit">検索</button></p>
</form>

<p><a href="/all_shelters">全施設一覧</a></p>
{% endblock %}
